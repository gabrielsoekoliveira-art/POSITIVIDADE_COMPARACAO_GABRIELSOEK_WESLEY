
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Positividade</title>
</head>
<body>

    <h1>Verificar número</h1>

    <label>Digite um número:</label>
    <input type="number" id="numero">

    <button onclick="verificar()">Verificar</button>

    <p id="resultado"></p>

    <script>
        function verificar() {
            let numero = parseFloat(document.getElementById("numero").value);

            if (numero > 0) {
                document.getElementById("resultado").innerHTML = "O número é positivo!";
            } 
            else if (numero < 0) {
                document.getElementById("resultado").innerHTML = "O número é negativo!";
            } 
            else {
                document.getElementById("resultado").innerHTML = "O número é nulo!";
            }
        }
    </script>

</body>
</html>
